# Optional: if you upload this folder to GitHub, this builds the mod jar for you
# (Actions tab -> latest run -> "nihongo-quest-jar" download). No local Java needed.
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: nihongo-quest-jar
          path: build/libs/*.jar
